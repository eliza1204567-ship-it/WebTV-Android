name: Build WebTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivo Bridge V3
        run: |
          echo "Archivos del repositorio:"
          ls -lah
          echo ""
          echo "Comprobando Bridge V3..."

          if [ ! -f "WebTV_Android_BRIDGE_V3.zip" ]; then
            echo "ERROR: No se encontró WebTV_Android_BRIDGE_V3.zip"
            exit 1
          fi

          echo "Bridge V3 encontrado correctamente."

      - name: Preparar carpeta del proyecto
        run: |
          rm -rf project
          mkdir -p project

      - name: Extraer Bridge V3
        run: |
          unzip -q "WebTV_Android_BRIDGE_V3.zip" -d project

      - name: Encontrar proyecto Android
        run: |
          echo "Buscando settings.gradle..."

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró un proyecto Gradle."
            echo ""
            echo "Contenido extraído:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verificar proyecto Android
        run: |
          echo "================================"
          echo "PROYECTO:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo ""
          echo "Archivos principales:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "Carpeta app:"
          ls -lah "$PROJECT_DIR/app"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Comprobar APK generado
        run: |
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No se generó el APK."
            exit 1
          fi

          echo "APK generado correctamente:"
          ls -lh "$APK_PATH"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: WebTV-Bridge-V3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
