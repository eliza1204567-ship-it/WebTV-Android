name: Build WebTV Bridge V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar ZIP V4
        run: |
          echo "Archivos del repositorio:"
          ls -lah

          if [ ! -f "WebTV_Android_BRIDGE_V4_READY.zip" ]; then
            echo "ERROR: No se encontró WebTV_Android_BRIDGE_V4_READY.zip"
            exit 1
          fi

          echo "ZIP V4 encontrado correctamente."

      - name: Preparar proyecto
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "WebTV_Android_BRIDGE_V4_READY.zip" -d project

      - name: Encontrar proyecto Gradle
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró settings.gradle.kts ni settings.gradle."
            echo ""
            echo "Contenido del ZIP:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verificar proyecto
        run: |
          echo "Proyecto:"
          echo "$PROJECT_DIR"
          echo ""
          echo "Contenido:"
          ls -lah "$PROJECT_DIR"
          echo ""
          echo "Carpeta app:"
          ls -lah "$PROJECT_DIR/app"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Comprobar APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se generó el APK."
            exit 1
          fi

          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: WebTV-Bridge-V4-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
