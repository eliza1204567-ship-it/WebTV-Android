name: Build WebTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WebTV_Android_BRIDGE_V2.zip -d project

      - name: Encontrar proyecto Gradle
        id: find-project
        shell: bash
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró settings.gradle.kts ni settings.gradle"
            echo "Contenido extraído:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Proyecto Gradle encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verificar proyecto
        run: |
          echo "=== PROYECTO ==="
          echo "$PROJECT_DIR"
          echo "=== ARCHIVOS ==="
          ls -la "$PROJECT_DIR"
          echo "=== APP ==="
          ls -la "$PROJECT_DIR/app"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebTV-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
